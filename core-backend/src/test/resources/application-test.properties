spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Mock AI Service URL
app.ai.service.url=http://localhost:9999
app.commission.rate=0.05

# Synthetic test values; no external credentials required.
jwt.secret=test-only-jwt-signing-key-at-least-32-bytes
aquatrade.internal.api-key=test-only-internal-secret
