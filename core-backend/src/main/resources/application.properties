# Enable SSL - DISABLED FOR DEMO (using HTTP instead of HTTPS)
# server.ssl.enabled=true
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=changeit
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=origin-server
server.port=8080

# === Realtime Event Publisher ===
aquatrade.realtime.enabled=${AQUATRADE_REALTIME_PUBLISH_ENABLED:false}
aquatrade.realtime.channel=${AQUATRADE_REALTIME_CHANNEL:aquatrade.events}

# === Redis Configuration ===
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# === PostgreSQL Database Configuration ===
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/aquatrade_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate Properties ===
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# === JWT Configuration ===
jwt.secret=${JWT_SECRET}
jwt.expiration.default=3600000
jwt.expiration.remember=2592000000

# === Cloudinary Configuration ===
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.video-preset=aquatrade_video_preset
cloudinary.image-preset=aquatrade_ai_image_preset

# === File Upload Configuration ===
# Max file size 10MB
spring.servlet.multipart.max-file-size=10MB
# Max request size 10MB
spring.servlet.multipart.max-request-size=10MB

# === Tuning for High Concurrency ===
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
server.tomcat.threads.max=400
server.tomcat.accept-count=200

# === Service endpoints (override for LAN deployments) ===
# Core callback base URL
app.baseUrl=${APP_BASEURL:http://localhost:8080}
# AI job endpoint
ai.service.url=${AI_SERVICE_URL:http://localhost:8000/ai/v1/jobs}

# Shared only between trusted internal services
aquatrade.internal.api-key=${INTERNAL_API_KEY:}

# Demo accounts are opt-in; passwords must be provided explicitly.
app.demo.seed-enabled=${DEMO_SEED_ENABLED:false}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:}
app.demo.seller-password=${DEMO_SELLER_PASSWORD:}
app.demo.buyer-password=${DEMO_BUYER_PASSWORD:}
