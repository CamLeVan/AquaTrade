<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        try {
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        "colors": {
                            "tertiary": "#3b82f6",
                            "surface-tint": "#13ecc8",
                            "tertiary-fixed": "#ffdf9f",
                            "on-tertiary": "#ffffff",
                            "on-error": "#ffffff",
                            "surface-container-lowest": "#ffffff",
                            "secondary-container": "#f1f5f9",
                            "on-tertiary-fixed": "#261a00",
                            "on-tertiary-fixed-variant": "#5b4300",
                            "outline-variant": "#13ecc80d",
                            "inverse-surface": "#10221f",
                            "tertiary-container": "#dbeafe",
                            "tertiary-fixed-dim": "#f3bf46",
                            "secondary-fixed": "#b1efdd",
                            "error": "#ef4444",
                            "surface-container-low": "#f0f4f4",
                            "secondary-fixed-dim": "#96d3c1",
                            "on-secondary-container": "#1e293b",
                            "outline": "#13ecc81a",
                            "surface": "#f6f8f8",
                            "on-secondary-fixed-variant": "#0d5043",
                            "primary-fixed-dim": "#00dfbd",
                            "inverse-on-surface": "#f3fbf7",
                            "surface-bright": "#ffffff",
                            "surface-dim": "#d3dcd8",
                            "on-primary-fixed": "#00201a",
                            "on-surface-variant": "#475569",
                            "on-primary": "#0a1a17",
                            "on-surface": "#0f172a",
                            "on-background": "#0f172a",
                            "inverse-primary": "#00dfbd",
                            "on-primary-container": "#006b59",
                            "secondary": "#334155",
                            "surface-variant": "#ffffff",
                            "surface-container-high": "#e1eae6",
                            "on-tertiary-container": "#1e40af",
                            "on-error-container": "#991b1b",
                            "surface-container": "#edf6f1",
                            "error-container": "#fee2e2",
                            "on-secondary-fixed": "#00201a",
                            "on-primary-fixed-variant": "#005143",
                            "primary": "#13ecc8",
                            "background": "#f6f8f8",
                            "primary-fixed": "#13ecc8",
                            "surface-container-highest": "#dce5e0",
                            "primary-container": "#13ecc81a",
                            "on-secondary": "#ffffff"
                        },
                        "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px"
                        },
                        "fontFamily": {
                            "headline": ["Inter"],
                            "display": ["Inter"],
                            "body": ["Inter"],
                            "label": ["Inter"]
                        }
                    }
                }
            }
        } catch (_e) {}
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .success-pulse {
            animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.3);
                opacity: 0.8;
            }
            80%, 100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        .glass-panel {
            background: rgba(246, 248, 248, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-md bg-surface/70 flex justify-between items-center px-6 h-16">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline font-bold tracking-tight text-on-surface text-lg">Trạng thái đơn hàng</h1>
</div>
<button class="active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface">more_vert</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center px-8 pt-32 pb-32 text-center relative overflow-hidden">
<!-- Abstract Decorative Background -->
<div class="absolute inset-0 pointer-events-none opacity-20">
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-64 h-64 bg-primary/20 rounded-full blur-[100px]"></div>
</div>
<!-- Success Animation Shell -->
<div class="relative mb-10">
<div class="absolute inset-0 bg-primary/20 rounded-full success-pulse"></div>
<div class="relative w-32 h-32 bg-surface-container-lowest rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-primary text-7xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Success Message -->
<div class="space-y-4 max-w-sm">
<h2 class="text-2xl font-bold tracking-tight text-on-surface">Đặt hàng thành công!</h2>
<p class="text-on-surface-variant leading-relaxed text-sm">2 đơn hàng đã được gửi đến người bán và đang chờ xác nhận.</p>
</div>
<!-- Tracking IDs Card -->
<div class="mt-10 w-full glass-panel border border-primary/10 rounded-xl p-6 text-left space-y-3 shadow-sm">
<span class="font-label uppercase tracking-widest text-[10px] text-primary font-bold">Mã tra cứu đơn hàng</span>
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between bg-surface/50 p-3 rounded-lg border border-outline">
<span class="font-mono text-sm font-semibold text-on-surface">#AQ-8892-004X</span>
<span class="material-symbols-outlined text-primary text-sm cursor-pointer">content_copy</span>
</div>
<div class="flex items-center justify-between bg-surface/50 p-3 rounded-lg border border-outline">
<span class="font-mono text-sm font-semibold text-on-surface">#AQ-8892-005Y</span>
<span class="material-symbols-outlined text-primary text-sm cursor-pointer">content_copy</span>
</div>
</div>
<div class="flex items-center gap-2 pt-2">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
<span class="text-[11px] text-on-surface-variant italic">Người bán sẽ xác nhận đơn trong thời gian sớm nhất.</span>
</div>
</div>
</main>
<!-- Action Buttons Area -->
<footer class="fixed bottom-0 left-0 w-full px-6 py-8 glass-panel z-50 flex flex-col gap-4 border-t border-outline-variant">
<button class="w-full h-14 bg-primary text-on-primary font-bold rounded-lg shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
<span>Xem đơn hàng</span>
<span class="material-symbols-outlined text-lg">receipt_long</span>
</button>
<button class="w-full h-14 bg-primary/10 text-primary font-bold rounded-lg active:scale-95 transition-all hover:bg-primary/20">
            Về trang chủ
        </button>
</footer>
<script>
        // Micro-interactions
        document.querySelectorAll('.material-symbols-outlined').forEach(icon => {
            if(icon.innerText === 'content_copy') {
                icon.parentElement.addEventListener('click', () => {
                    const text = icon.previousElementSibling.innerText;
                    navigator.clipboard.writeText(text);
                    const originalIcon = icon.innerText;
                    icon.innerText = 'check';
                    icon.classList.add('text-green-500');
                    setTimeout(() => {
                        icon.innerText = originalIcon;
                        icon.classList.remove('text-green-500');
                    }, 2000);
                });
            }
        });
    </script>
</body></html>
